<title>Geminus 工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Noto+Sans+TC:wght@400..700&display=swap">
<style>
/* Layout: a two-row strip (product and mode; provenance and actions) over one stage.
   The stage is the model canvas with the Marey strip along its bottom, and a 400 px
   panel on the right (Draft or inspector in Edit, Compare in Simulate, the proposal in
   Review). Compare can take the whole stage. White timetable sheet on a pale neutral
   shell, graphite ink; gray-black slate in dark. */
:root{
  --ground:#EDEDEA;--sheet:#FFFFFF;--panel:#FFFFFF;--raised:#FFFFFF;--well:#F3F3F1;--hover:#F0F0ED;--press:#E5E5E1;
  --grid:#F1F1EE;--gridmaj:#E3E3DF;--tg:#EDEDEA;--tgmaj:#D9D9D4;--rule:#DADAD6;--edge:#808387;
  --ink:#1B1D1F;--ink2:#4D5155;--ink3:#62666A;--ink4:#9A9DA0;--base:#3F4347;
  --sc:#0B6B4B;--scwash:#E8F2ED;--scfg:#FFFFFF;
  --amb:#8A4F00;--ambmark:#B26B00;--ambwash:#FDF3DD;--ambedge:#D29A3A;
  --err:#B3261E;--errwash:#FCEEEC;--erredge:#D9837D;
  --sel:#1B1D1F;--seltint:#EFEFEC;--onink:#FFFFFF;--avatar:#3F4347;--onavatar:#FFFFFF;--focus:#1B1D1F;--selbg:#D6D9DB;
  --veil:rgba(27,29,31,.36);--shadow:0 1px 2px rgba(27,29,31,.10),0 10px 28px rgba(27,29,31,.16);
  --font:Archivo,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs1:12px;--fs2:13.5px;--fs3:15px;--fs4:18px;--fs5:22px;
  --r1:4px;--r2:6px;--ease:cubic-bezier(.2,.8,.2,1);--dur:.18s;--panelw:400px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111111;--sheet:#171717;--panel:#1B1B1B;--raised:#232323;--well:#0D0D0D;--hover:#2A2A2A;--press:#323232;
  --grid:#1C1C1C;--gridmaj:#252525;--tg:#1F1F1F;--tgmaj:#2E2E2E;--rule:#2E2E2E;--edge:#707070;
  --ink:#EBEBEB;--ink2:#B5B5B5;--ink3:#949494;--ink4:#5E5E5E;--base:#C9C9C9;
  --sc:#5CC79E;--scwash:#242424;--scfg:#0F0F0F;
  --amb:#F0B44C;--ambmark:#F0B44C;--ambwash:#242424;--ambedge:#B07A1E;
  --err:#F07A70;--errwash:#242424;--erredge:#B5534B;
  --sel:#EBEBEB;--seltint:#262626;--onink:#111111;--avatar:#3A3A3A;--onavatar:#FFFFFF;--focus:#EBEBEB;--selbg:#3B3B3B;
  --veil:rgba(0,0,0,.62);--shadow:0 0 0 1px #3A3A3A,0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#111111;--sheet:#171717;--panel:#1B1B1B;--raised:#232323;--well:#0D0D0D;--hover:#2A2A2A;--press:#323232;
  --grid:#1C1C1C;--gridmaj:#252525;--tg:#1F1F1F;--tgmaj:#2E2E2E;--rule:#2E2E2E;--edge:#707070;
  --ink:#EBEBEB;--ink2:#B5B5B5;--ink3:#949494;--ink4:#5E5E5E;--base:#C9C9C9;
  --sc:#5CC79E;--scwash:#242424;--scfg:#0F0F0F;
  --amb:#F0B44C;--ambmark:#F0B44C;--ambwash:#242424;--ambedge:#B07A1E;
  --err:#F07A70;--errwash:#242424;--erredge:#B5534B;
  --sel:#EBEBEB;--seltint:#262626;--onink:#111111;--avatar:#3A3A3A;--onavatar:#FFFFFF;--focus:#EBEBEB;--selbg:#3B3B3B;
  --veil:rgba(0,0,0,.62);--shadow:0 0 0 1px #3A3A3A,0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 var(--fs2)/1.4 var(--font);font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;overflow:hidden;caret-color:var(--ink);accent-color:var(--ink)}
::selection{background:var(--selbg);color:var(--ink)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:13px;height:13px}
.k{width:20px;height:8px;flex:none;overflow:visible}.k line{stroke-width:2}.k .b{stroke:var(--base);stroke-dasharray:4 2.5}.k .s{stroke:var(--sc)}
.to{color:var(--ink2);padding:0 .2em}
.sv{color:var(--sc);font-weight:600}
.mu{color:var(--ink2)}.lb{color:var(--ink3);font-size:var(--fs1)}
kbd{font-family:inherit;font-size:var(--fs1);font-weight:500;line-height:1;color:var(--ink2);border:1px solid var(--rule);border-radius:var(--r1);padding:3px 5px;background:var(--well);white-space:nowrap}

/* buttons */
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border:1px solid var(--edge);border-radius:var(--r2);background:var(--raised);font-size:var(--fs2);font-weight:500;white-space:nowrap;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn:hover{background:var(--hover)}.btn:active{background:var(--press)}
.btn.ib{width:32px;padding:0}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--onink);font-weight:600}
.btn.pri:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.pri.sc{background:var(--sc);border-color:var(--sc);color:var(--scfg)}
.btn.pri.sc:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent}.btn.quiet:hover{background:var(--hover)}
.btn.danger{color:var(--err)}
.btn[aria-disabled="true"],.btn:disabled{background:var(--well);border-color:var(--rule);color:var(--ink4);cursor:not-allowed;filter:none}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-weight:500}
.link:hover{text-decoration-thickness:2px}
.tagn{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--rule);border-radius:var(--r1);font-size:var(--fs1);color:var(--ink2);font-weight:500;white-space:nowrap}

/* skip links */
.skips{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:8px;z-index:60;display:flex;gap:8px}
.skip{position:absolute;left:-9999px;padding:8px 12px;background:var(--ink);color:var(--onink);border-radius:var(--r2);font-weight:600;text-decoration:none}
.skip:focus{position:static}

/* app frame */
.app{height:100%;display:grid;grid-template-rows:48px 44px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.bar1{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ground);border-bottom:1px solid var(--rule);min-width:0}
.b1l{display:flex;align-items:center;gap:16px;min-width:0}
.brand{font-size:var(--fs4);font-weight:700;letter-spacing:-.01em;line-height:24px;padding-right:16px;border-right:1px solid var(--rule);flex:none}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
.crumb>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crumb .p{color:var(--ink2);flex:0 1 auto}.crumb .s{color:var(--ink3);flex:none}.crumb b{font-weight:600;flex:0 1 auto}
.modes{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r2);overflow:hidden;background:var(--raised)}
.modes button{height:30px;padding:0 16px;border:0;background:none;font-size:var(--fs2);display:inline-flex;align-items:center;gap:8px;transition:background-color var(--dur) var(--ease)}
.modes button+button{border-left:1px solid var(--edge)}
.modes button:hover{background:var(--hover)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--onink);font-weight:600}
.modes .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;border:1px solid currentColor;font-size:var(--fs1);line-height:16px;font-weight:600}
.b1r{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.find{color:var(--ink)}
.lseg{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r2);overflow:hidden;background:var(--raised)}
.lseg button{height:30px;min-width:40px;padding:0 10px;border:0;background:none;font-size:var(--fs2)}
.lseg button+button{border-left:1px solid var(--edge)}
.lseg button:hover{background:var(--hover)}
.lseg button[aria-pressed="true"]{background:var(--ink);color:var(--onink);font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--avatar);color:var(--onavatar);display:grid;place-items:center;font-size:var(--fs1);font-weight:600;flex:none}

/* provenance row */
.bar2{display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ground);border-bottom:1px solid var(--edge);min-width:0}
.prov{display:flex;align-items:center;min-width:0;flex:1 1 auto;overflow:hidden}
.pv{display:flex;align-items:center;gap:6px;padding:0 14px;height:24px;border-left:1px solid var(--rule);white-space:nowrap;min-width:0}
.pv:first-child{padding-left:0;border-left:0}
.pv dt{color:var(--ink3);font-size:var(--fs1)}
.pv dd{display:flex;align-items:center;gap:6px;min-width:0}
.pv dd b{font-weight:600}
.pv .ic{color:var(--ink2)}.pv.s .ic{color:var(--sc)}
.pv .x{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink2);flex:none}
.pv .warnt{color:var(--amb)}
.pv .tok{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.prov[data-c="1"] .o1,.prov[data-c="2"] .o1,.prov[data-c="2"] .o2,.prov[data-c="3"] .o1,.prov[data-c="3"] .o2,.prov[data-c="3"] .o3{display:none}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.acts .why{color:var(--ink2);font-size:var(--fs1);max-width:150px;text-align:right;line-height:1.25}
.runbtn{display:inline-flex}
.runbtn .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.runbtn .btn+.btn{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid color-mix(in srgb,var(--scfg) 40%,transparent);width:30px;padding:0}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) var(--panelw);grid-template-rows:minmax(0,1fr);min-height:0;min-width:0}
.ccol{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;background:var(--sheet);position:relative}
.flow{position:relative;overflow:hidden;min-height:0;background-color:var(--sheet);touch-action:none;cursor:grab}
.flow.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fa{stroke:var(--ink2);stroke-width:1.5;fill:none}
.ln{stroke:var(--ink3);stroke-width:1;fill:none}.lnd{fill:var(--sheet);stroke:var(--ink3);stroke-width:1}
.wl{stroke:var(--ambedge);stroke-width:1}
.e-add{stroke:var(--ink);stroke-width:2;fill:none}
.e-rm{stroke:var(--err);stroke-width:1.75;stroke-dasharray:6 4;fill:none}
.e-rmx{stroke:var(--err);stroke-width:2;stroke-linecap:round}

/* nodes */
.node{position:absolute;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:0 0 10px;background:var(--raised);border:1px solid var(--edge);border-radius:var(--r1);color:var(--ink);font-size:var(--fs2);line-height:1.3;transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.node:hover{border-color:var(--ink2)}
.node .nh{height:39px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--rule)}
.node .nn{font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .np{display:block;padding:8px 12px 0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .np.wr{white-space:normal}
.node .np.sl{padding-top:2px}
.node .np.wr+.np.wr{padding-top:2px}
.tag.flag{position:absolute;top:-11px;right:8px}
.node .nm{display:block;padding:6px 12px 0}
.node .kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:20px;white-space:nowrap}
.node .kv .k1{font-size:var(--fs1);color:var(--ink3)}
.node .kv .v1{font-size:var(--fs3)}
.node .bars{display:block;margin:3px 0 6px}
.node .bar{display:block;height:6px;position:relative;border-radius:1px}
.node .bar+.bar{margin-top:3px}
.node .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:1px}
.node .bar.b i{border:1.5px solid var(--base);background:none}
.node .bar.s{background:var(--well)}.node .bar.s i{background:var(--sc)}
.node .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.node .kl{display:block;font-size:var(--fs1);color:var(--ink2);line-height:16px;margin-top:6px;word-break:keep-all}
.node .vl{display:block;font-size:var(--fs3);line-height:20px;white-space:nowrap}
.ubar{display:block;margin:4px 0 2px;overflow:visible}
.ubar .ut{stroke:var(--rule);stroke-width:1}
.ubar .ub{stroke:var(--base);stroke-width:2;stroke-dasharray:4 2.5}
.ubar .us{stroke:var(--sc);stroke-width:2.5}
.node.end{padding-bottom:0}.node.end .nh{border-bottom:0}
.node.end.withv{padding-bottom:10px}.node.end.withv .nh{border-bottom:1px solid var(--rule)}
.node.is-sel{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--sel);border-color:var(--sel)}
.node:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.node.is-sel:focus-visible{outline-offset:9px}
.node.has-err{border-color:var(--err)}
.node.is-added{border:2px solid var(--ink)}
.node.is-ghost{border-style:dashed}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:1px solid var(--sc);border-radius:10px;color:var(--sc);font-size:var(--fs1);font-weight:600;flex:none;white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.ink{border-color:var(--ink);background:var(--ink);color:var(--onink)}
/* Review is drawn at about 82% at 1280: its labels use the node text size so they stay 11 px or more */
.app[data-mode="review"] .node .tag,.app[data-mode="review"] .pool .tag{font-size:var(--fs2);height:22px}.app[data-mode="review"] .tag.flag{top:-12px}
.tag.err{border-color:var(--err);color:var(--err)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:var(--r1);font-size:var(--fs1);font-weight:600;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.err{background:var(--errwash);color:var(--err);border:1px solid var(--erredge)}
.chip.warn{background:var(--ambwash);color:var(--amb);border:1px solid var(--ambedge)}
.pool{position:absolute;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border:1px solid var(--edge);border-radius:22px;background:var(--raised);font-size:var(--fs2);color:var(--ink);text-align:left;transition:box-shadow var(--dur) var(--ease)}
.pool:hover{border-color:var(--ink2)}
.pool .ic{color:var(--ink2)}
.pool .pn{flex:1 1 auto;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool em{font-style:normal;font-size:var(--fs3);font-weight:600;white-space:nowrap}
.pool.is-sel{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--sel);border-color:var(--sel)}
.pool:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.pool.is-sel:focus-visible{outline-offset:9px}
.pool.has-err{border-color:var(--err)}
.pool.is-added{border:2px solid var(--ink)}
.callout{position:absolute;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--ambedge);border-radius:var(--r2);background:var(--ambwash);color:var(--amb);font-size:var(--fs1);white-space:nowrap;pointer-events:none}
.callout .ic{color:var(--ambmark)}.callout b{font-weight:600}
.rmtag{position:absolute;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--err);border-radius:var(--r1);background:var(--raised);color:var(--err);font-size:var(--fs1);font-weight:600;white-space:nowrap;pointer-events:none}
.app[data-mode="review"] .rmtag{font-size:var(--fs2);height:28px}

/* canvas chrome */
.ctop{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.ctop>*{pointer-events:auto}
.ctop .sp{flex:1;pointer-events:none}
.cap{display:flex;flex-direction:column;gap:3px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:6px 10px;font-size:var(--fs1);color:var(--ink2);max-width:460px;min-width:0}
.cap .l3{display:flex;flex-wrap:wrap;gap:2px 12px}
.cap .tok{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--ink)}
.cap .tok .tl{color:var(--ink2)}
.cap .tok.syn{font-weight:600}
.cap .tok .ic{color:var(--ink2)}
.cap .l1{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:var(--fs2);font-weight:600;white-space:nowrap}
.cap .l2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cap .l2 span{display:inline-flex;align-items:center;gap:6px}
.tbar{display:flex;align-items:center;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:3px}
.tbar .btn{height:30px;border-color:transparent;background:transparent;padding:0 10px;gap:6px}
.tbar .btn:hover{background:var(--hover)}
.tbar .btn[aria-disabled="true"]{background:transparent;color:var(--ink4)}
.tbar kbd{padding:2px 4px}
.tbar .sepv{width:1px;height:20px;background:var(--rule);margin:0 2px}
.vseg,.zoom{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r2);background:var(--raised);overflow:hidden}
.vseg button,.zoom button{height:30px;min-width:32px;border:0;background:none;display:grid;place-items:center;font-size:var(--fs1);padding:0 8px}
.vseg button+button,.zoom>*+*{border-left:1px solid var(--edge)}
.vseg button:hover,.zoom button:hover{background:var(--hover)}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--onink);font-weight:600}
.zoom output{height:30px;display:grid;place-items:center;padding:0 8px;font-size:var(--fs1);min-width:48px}
.cbot{position:absolute;left:16px;bottom:16px;right:16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:3}
.cbot>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--edge);border-radius:16px;background:var(--raised);font-weight:500}
.pill:hover{background:var(--hover)}
.pill .ic.e{color:var(--err)}.pill .ic.w{color:var(--ambmark)}.pill .ic.ok{color:var(--sc)}
.three{position:absolute;inset:0;display:grid;place-items:center;background:var(--sheet);z-index:4;padding:24px}
.three .box{max-width:460px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.three h2{font-size:var(--fs4);font-weight:600;display:flex;align-items:center;gap:8px}
.three p{color:var(--ink2);max-width:60ch}

/* overlays: popover, drawer, menu, toast */
.ov{position:absolute;z-index:20;background:var(--raised);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.ov.in{opacity:1;transform:none}
.pop{width:264px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pop h2{font-size:var(--fs3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop .row label,.pop .row .lbl{color:var(--ink2)}

    } else for (const v of vals) o += `<line class="${s ? "tb" : "ts"}" x1="${X(v).toFixed(1)}" y1="${y}" x2="${X(v).toFixed(1)}" y2="${y + 16}"/>`;
