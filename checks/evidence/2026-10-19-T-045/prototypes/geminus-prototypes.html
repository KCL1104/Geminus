<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geminus low-fi prototypes</title>
<style>
/* Low-fi prototype for owner review (T-045, REQ-023). Not product code:
   the real screens are built in T-015 and T-031 with apps/web/ui. Colours
   and sizes are the design tokens of apps/web/ui/tokens.css. */
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #f6f7f9; --surface-hover: #eceef2; --border: #d9dde3; --border-strong: #6b7380;
  --text: #1b1f24; --muted: #545c68; --accent: #1f5fbf; --accent-hover: #194f9f; --on-accent: #ffffff;
  --selected: #e8f0fc; --danger: #b42318; --danger-bg: #fdf0ef; --warning: #8a5300; --warning-bg: #fff6e5;
  --success: #17663a; --success-bg: #ebf7ef; --info: #143f80; --info-bg: #e8f0fc; --focus: #1f5fbf;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --control: 32px; --radius: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
:lang(zh-Hant) body, body:lang(zh-Hant) { line-height: 1.6; }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.25; }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0 0 8px; }
code { font-family: var(--mono); font-size: 0.95em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select, input { font: inherit; }
.btn { min-height: var(--control); padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
input, select { min-height: var(--control); padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); color: var(--text); }
input[aria-invalid=true] { border-color: var(--danger); }
label { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 13px; }
.err { color: var(--danger); font-size: 13px; }
.callout { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius); background: var(--surface); }
.callout.info { border-color: var(--info); background: var(--info-bg); }
.callout.warning { border-color: var(--warning); background: var(--warning-bg); }
.callout.danger { border-color: var(--danger); background: var(--danger-bg); }
.callout.success { border-color: var(--success); background: var(--success-bg); }
.callout h3 { margin-bottom: 4px; }
.callout.danger h3 { color: var(--danger); } .callout.warning h3 { color: var(--warning); }
.status:empty { display: none; }
.status { margin: 0 0 12px; padding: 6px 12px; border-left: 4px solid var(--success); background: var(--success-bg); color: var(--success); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface-hover); font-size: 12px; font-weight: 600; }
.badge.high { background: var(--danger-bg); color: var(--danger); } .badge.low { background: var(--success-bg); color: var(--success); }
.badge.err { background: var(--danger-bg); color: var(--danger); } .badge.warn { background: var(--warning-bg); color: var(--warning); }
table { width: 100%; border-collapse: collapse; }
th, td { height: 32px; padding: 0 10px; border-bottom: 1px solid var(--border); text-align: start; }
th { background: var(--surface); border-bottom-color: var(--border-strong); white-space: nowrap; }
tr.clickable { cursor: pointer; } tr.clickable:hover { background: var(--surface); }
.box { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; margin-bottom: 12px; }

/* Shell */
.proto-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: #fff8d6; border-bottom: 2px dashed #8a5300; font-size: 13px; }
.proto-bar strong { color: #8a5300; }
header.app { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; min-height: 48px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
header.app .brand { font-size: 16px; font-weight: 600; }
header.app nav { display: flex; gap: 16px; }
header.app nav button { border: 0; background: none; color: var(--accent); font-weight: 600; min-height: var(--control); cursor: pointer; padding: 0 2px; }
header.app nav button[aria-current=page] { color: var(--text); text-decoration: underline; text-underline-offset: 6px; }
header.app .tools { margin-inline-start: auto; }
main { padding: 16px; max-width: 1280px; margin: 0 auto; }

/* Editor */
.editor-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.editor-head .meta { color: var(--muted); }
.editor-head .actions { margin-inline-start: auto; }
.editor { display: grid; grid-template-columns: 180px 1fr 300px; gap: 12px; }
.editor > * { min-width: 0; } /* the canvas scrolls in its box instead of widening the page */
.palette, .props { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: var(--bg); }
.palette ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.palette .btn { width: 100%; justify-content: flex-start; text-align: start; }
.canvas { position: relative; min-height: 360px; border: 1px solid var(--border); border-radius: var(--radius); background: radial-gradient(circle, #c4c9d1 1px, transparent 1px) 0 0/16px 16px, var(--surface); overflow: auto; }
.canvas svg { display: block; min-width: 760px; }
.node rect { fill: #fff; stroke: var(--border-strong); stroke-width: 1.5; rx: 6; }
.node text { font: 600 13px var(--font); fill: var(--text); }
.node .sub { font-weight: 400; font-size: 11px; fill: var(--muted); }
.node.selected rect { stroke: var(--accent); stroke-width: 3; }
.node.has-error rect { stroke: var(--danger); }
.node:focus-visible rect { stroke: var(--focus); stroke-width: 3; stroke-dasharray: 4 2; }
.node { cursor: pointer; }
.edge { stroke: var(--border-strong); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.issue-dot { fill: var(--danger); }
.canvas-note { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; }
.issues { margin-top: 12px; }

/* Import / proposal */
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 16px; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 16px; color: var(--muted); }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-hover); font-size: 12px; font-weight: 600; }
.steps li[aria-current=step] { border-color: var(--accent); color: var(--text); font-weight: 600; }
.steps li[aria-current=step]::before { background: var(--accent); color: #fff; }
.steps li.done::before { content: "✓"; background: var(--success); color: #fff; }
.drop { display: grid; place-items: center; gap: 8px; min-height: 140px; padding: 16px; border: 2px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface); text-align: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.diff li { margin-bottom: 6px; }
.diff .op { display: inline-block; min-width: 64px; font-weight: 600; }
.diff .add { color: var(--success); } .diff .chg { color: var(--info); } .diff .del { color: var(--danger); }
.kind-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.sticky-actions { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); background: var(--bg); }
/* Keep a focused control from scrolling under the sticky bar (WCAG 2.4.11). */
html { scroll-padding-bottom: 72px; }

dialog { width: min(30rem, calc(100% - 32px)); padding: 20px; border: 0; border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(27,31,36,.45); }
dialog .row { justify-content: flex-end; margin-top: 16px; }

.hidden { display: none !important; }

/* Phone: one column; the properties become a panel under the canvas; the palette a menu. */
@media (max-width: 760px) {
  .editor { grid-template-columns: 1fr; }
  .palette ul { flex-direction: row; flex-wrap: wrap; }
  .palette .btn { width: auto; }
  .two { grid-template-columns: 1fr; }
  header.app .tools { margin-inline-start: 0; }
  .sticky-actions { position: static; }
}
</style>
</head>
<body>
<div class="proto-bar" role="region" aria-labelledby="proto-label">
  <strong id="proto-label" data-t="proto.label"></strong>
  <span data-t="proto.note"></span>
  <label class="row"><span data-t="proto.state"></span>
    <select id="proto-state"></select>
  </label>
</div>
<header class="app">
  <span class="brand">Geminus</span>
  <nav aria-label="Main" id="nav">
    <button type="button" data-view="editor" aria-current="page" data-t="nav.editor"></button>
    <button type="button" data-view="import" data-t="nav.import"></button>
    <button type="button" data-view="proposal" data-t="nav.proposal"></button>
  </nav>
  <div class="tools row">
    <label for="lang" data-t="lang"></label>
    <select id="lang"><option value="en" lang="en">English</option><option value="zh-Hant" lang="zh-Hant">繁體中文</option></select>
  </div>
</header>

<main id="main" tabindex="-1">
  <p class="status" role="status" id="status"></p>
  <div id="banner"></div>

  <!-- T-015: model editor -->
  <section id="view-editor">
    <div class="editor-head">
      <h1>Delivery pipeline</h1>
      <span class="badge" id="ver"></span>
      <span class="meta" id="draft-state"></span>
      <div class="actions row">
        <button type="button" class="btn" id="save" disabled data-t="ed.save"></button>
        <button type="button" class="btn primary" id="publish" data-t="ed.publish"></button>
        <button type="button" class="btn quiet" id="reset" data-t="ed.reset"></button>
      </div>
    </div>
    <div class="editor">
      <aside class="palette" aria-labelledby="pal-h">
        <h2 id="pal-h" data-t="ed.palette"></h2>
        <ul>
          <li><button type="button" class="btn" data-add="queue" data-t="ed.add.queue"></button></li>
          <li><button type="button" class="btn" data-add="process" data-t="ed.add.process"></button></li>
          <li><button type="button" class="btn" data-add="decision" data-t="ed.add.decision"></button></li>
          <li><button type="button" class="btn" data-add="resource" data-t="ed.add.resource"></button></li>
        </ul>
        <p class="hint" data-t="ed.palette.hint"></p>
      </aside>
      <div>
        <div class="canvas" role="application" aria-roledescription="" id="canvas-wrap" aria-describedby="canvas-help">
          <svg id="canvas" width="760" height="300" viewBox="0 0 760 300">
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7380"/></marker></defs>
            <g id="edges"></g><g id="nodes"></g>
          </svg>
          <span class="canvas-note" id="canvas-help" data-t="ed.canvas.help"></span>
        </div>
        <div class="issues">
          <h2 data-t="ed.issues"></h2>
          <div class="box"><table><thead><tr><th data-t="ed.col.where"></th><th data-t="ed.col.problem"></th><th data-t="ed.col.sev"></th></tr></thead><tbody id="issues"></tbody></table></div>
        </div>
      </div>
      <aside class="props" aria-labelledby="props-h">
        <h2 id="props-h" data-t="ed.props"></h2>
        <div id="props"></div>
      </aside>
    </div>
  </section>

  <!-- T-031: import -->
  <section id="view-import" class="hidden">
    <h1 data-t="im.title"></h1>
    <ol class="steps" id="im-steps"></ol>
    <div id="im-body"></div>
  </section>

  <!-- T-031: proposal review -->
  <section id="view-proposal" class="hidden">
    <h1 data-t="pr.title"></h1>
    <div class="kind-tabs" role="group" aria-label="">
      <button type="button" class="btn" id="kind-edit" aria-pressed="true" data-t="pr.kind.edit"></button>
      <button type="button" class="btn" id="kind-scenario" aria-pressed="false" data-t="pr.kind.scenario"></button>
    </div>
    <div id="pr-body"></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlg-h" aria-describedby="dlg-b">
  <h2 id="dlg-h"></h2>
  <div id="dlg-b"></div>
  <div class="row"><button type="button" class="btn" id="dlg-cancel" autofocus></button><button type="button" class="btn" id="dlg-ok"></button></div>
</dialog>

  }
  const stale = S.proto === "stale";
  b.innerHTML = (stale ? `<section class="callout danger" role="alert"><h3>${esc(t("pr.stale.h"))}</h3><p>${esc(t("pr.stale.b", { base: 3, cur: 4 }))}</p><button type="button" class="btn primary">${esc(t("pr.stale.again", { cur: 4 }))}</button></section>` : "") +
    (S.kind === "scenario" ? `<section class="callout info" role="note">${esc(t("pr.scen.note", { base: 3 }))}</section>` : "") +
    `<div class="two"><div>
      <section class="panel"><h2>${esc(t("pr.intent"))}</h2><p>${esc(t("pr.intentText"))}</p><p class="row"><span class="badge">${esc(t("pr.base", { v: 3 }))}</span><span class="hint">${stale ? "" : esc(t("pr.base.ok"))}</span></p></section>
      <section class="panel"><h2>${esc(t("pr.changes"))}</h2><ul class="diff">
        <li><span class="op add">${esc(t("pr.op.add"))}</span>${esc(t("pr.c1"))}</li><li><span class="op add">${esc(t("pr.op.add"))}</span>${esc(t("pr.c2"))}</li><li><span class="op chg">${esc(t("pr.op.change"))}</span>${esc(t("pr.c3"))}</li></ul></section>
      <section class="panel"><h2>${esc(t("pr.assume"))}</h2><ul><li>${esc(t("pr.a1"))}</li><li>${esc(t("pr.a2"))}</li></ul></section>
    </div><div>
      <section class="panel"><h2>${esc(t("pr.risk"))}</h2><p class="row"><span class="badge high">${esc(t("pr.risk.server", { level: t("pr.risk.high") }))}</span><span class="badge">${esc(t("pr.risk.ai", { level: t("pr.risk.low") }))}</span></p><p class="hint">${esc(t("pr.risk.why"))}</p></section>
      <section class="panel"><h2>${esc(t("pr.valid"))}</h2><p>${esc(t("pr.valid.ok"))}</p></section>
      <section class="panel"><h2>${esc(t("pr.effects"))}</h2><p>${esc(t("pr.e1"))}</p></section>
    </div></div>
    <div class="sticky-actions">
      <button type="button" class="btn primary" id="ap" ${stale || S.proto === "forbidden" ? "disabled" : ""}>${esc(S.kind === "edit" ? t("pr.approve.edit", { v: 4 }) : t("pr.approve.scenario"))}</button>
      <button type="button" class="btn" id="ef" ${stale ? "disabled" : ""}>${esc(t("pr.editFirst"))}</button>
      <button type="button" class="btn danger" id="rj">${esc(t("pr.reject"))}</button>
    </div>`;
  $("#ap").addEventListener("click", () => S.kind === "edit"
    ? confirmDlg("pr.approve.h", t("pr.approve.b", { base: 3 }), "pr.approve.edit", "primary", () => setStatus(t("pr.approve.done", { v: 4 })), { v: 4 })
    : confirmDlg("pr.scen.h", t("pr.scen.b", { base: 3 }), "pr.approve.scenario", "primary", () => setStatus(t("pr.scen.done"))));
  $("#rj").addEventListener("click", () => confirmDlg("pr.reject.h", `${esc(t("pr.reject.b"))}<div class="field" style="margin-top:8px"><label class="hidden" for="why">why</label><input id="why"></div>`, "pr.reject", "danger", () => setStatus(t("pr.reject.done")), {}, true));
  $("#ef").addEventListener("click", () => { S.view = "editor"; render(); });
}

/* ---------- dialog ---------- */
let onOk = null, opener = null;
function confirmDlg(hKey, body, okKey, tone, ok, params = {}, html = false) {
  opener = document.activeElement;
  $("#dlg-h").textContent = t(hKey, params);
  if (html) $("#dlg-b").innerHTML = body; else $("#dlg-b").textContent = body;
  $("#dlg-cancel").textContent = t("common.cancel");
  $("#dlg-ok").textContent = t(okKey, params);
  $("#dlg-ok").className = "btn " + tone;
  onOk = ok; $("#dlg").showModal(); $("#dlg-cancel").focus();
}
$("#dlg-cancel").addEventListener("click", () => $("#dlg").close());
$("#dlg-ok").addEventListener("click", () => { $("#dlg").close(); onOk?.(); });
$("#dlg").addEventListener("close", () => { if (opener?.isConnected) opener.focus(); });

/* ---------- wiring ---------- */
function render() {
  renderStatic(); banner();
  for (const v of ["editor", "import", "proposal"]) { $("#view-" + v).classList.toggle("hidden", S.view !== v); document.querySelector(`[data-view="${v}"]`).toggleAttribute("aria-current", S.view === v); if (S.view === v) document.querySelector(`[data-view="${v}"]`).setAttribute("aria-current", "page"); }
  if (S.view === "editor") renderEditor(); else if (S.view === "import") renderImport(); else renderProposal();
}
for (const b of document.querySelectorAll("[data-view]")) b.addEventListener("click", () => {
  const go = () => { S.view = b.dataset.view; setStatus(""); render(); $("#main").focus(); };
  if (S.view === "editor" && S.dirty && b.dataset.view !== "editor") confirmDlg("ed.leave.h", t("ed.leave.b", { n: S.dirty }), "ed.leave.ok", "danger", () => { S.dirty = 0; go(); });
  else go();
});
$("#lang").addEventListener("change", (e) => { lang = e.target.value; render(); });
$("#proto-state").addEventListener("change", (e) => { S.proto = e.target.value; render(); });
$("#save").addEventListener("click", () => { S.revision += 1; S.dirty = 0; setStatus(t("ed.saved.ok", { r: S.revision })); renderEditor(); $("#save").focus(); });
$("#publish").addEventListener("click", () => {
  const n = issues().filter((e) => e.sev === "error").length;
  if (n) confirmDlg("ed.pub.blocked.h", t("ed.pub.blocked.b", { n }), "common.keep", "primary", () => {});
  else confirmDlg("ed.pub.h", t("ed.pub.b", { v: S.version + 1, old: S.version }), "ed.pub.ok", "primary", () => { S.version += 1; S.dirty = 0; setStatus(t("ed.pub.done", { v: S.version })); renderEditor(); }, { v: S.version + 1 });
});
$("#reset").addEventListener("click", () => confirmDlg("ed.reset.h", t("ed.reset.b", { n: S.dirty, v: S.version }), "ed.reset.ok", "danger", () => { S.dirty = 0; setStatus(t("ed.reset.done", { v: S.version })); renderEditor(); }));
for (const b of document.querySelectorAll("[data-add]")) b.addEventListener("click", () => { const id = "new" + S.nodes.length; S.nodes.splice(S.nodes.length - 1, 0, { id, name: t("ed.add." + b.dataset.add), kind: "process", x: 0, y: 0, capacity: "1" }); S.nodes.forEach((n, i) => { n.x = 20 + i * (720 / Math.max(1, S.nodes.length - 1)) * 0.95; }); S.dirty += 1; select(id); });
$("#kind-edit").addEventListener("click", () => { S.kind = "edit"; renderProposal(); });
$("#kind-scenario").addEventListener("click", () => { S.kind = "scenario"; renderProposal(); });
render();
</script>
</body>
</html>
