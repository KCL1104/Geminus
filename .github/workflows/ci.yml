# T-002 CI skeleton. Runs only checks that exist and really execute; product
# gates that are not built yet stay as failing `make` targets and are not
# listed here. Tool versions: docs/adr/ADR-011-toolchain-bootstrap.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: "Make new screenshot baselines (uploaded as the artifact 'screenshots' for a person to review and commit)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  spec:
    name: spec-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-spec.txt
      - run: make spec-check PYTHON=python
      - name: Committed check reports match a fresh run
        run: git diff --exit-code -- checks/

  backend:
    name: backend (go vet, test, race, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: make backend-test
      - run: make backend-race
      - name: Numerical profile (no FMA or platform math in engine code; GOAMD64=v3 tests)
        run: make backend-numeric
        env:
          REQUIRE_GOAMD64_V3: "1"
      - run: make backend-build
      - name: Architecture (package dependency rules)
        run: make architecture-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: SimPy reference of finite buffers and blocking (T-047, TEST-034)
        run: |
          python -m pip install -r requirements-spec.txt
          make simulation-reference-test PYTHON=python
      - name: Go vulnerability scan (govulncheck, pinned)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/... ./schemas/... ./scripts/...

  frontend:
    name: frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web --no-audit
      - name: V8 number vectors regenerate byte for byte (RFC 8785 oracle, ADR-014)
        run: node scripts/gen_number_vectors.mjs | diff - testdata/hashing/v8-number-vectors.txt
      - name: Production dependency audit (D-031; dev-only braces advisory accepted)
        run: npm audit --prefix apps/web --omit=dev --audit-level=high
      - run: make frontend-test
      - run: make frontend-build

  e2e:
    name: browser checks (axe, keyboard, strings, screenshots)
    runs-on: ubuntu-24.04
    # Screenshots depend on the fonts installed, so baselines are made and
    # compared only in this pinned image (apps/web-e2e/README.md).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      E2E_SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - run: npm ci --prefix apps/web --no-audit
      - run: npm ci --prefix apps/web-e2e --no-audit
      # The image has no make: the same command as `make e2e-test`.
      - if: ${{ !inputs.update_screenshots }}
        run: npm --prefix apps/web-e2e test
      - name: Make new screenshot baselines (never committed by CI)
        if: ${{ inputs.update_screenshots }}
        run: npm --prefix apps/web-e2e test -- tests/screenshots.spec.ts --update-snapshots
      - if: ${{ inputs.update_screenshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: apps/web-e2e/tests/__screenshots__/
          if-no-files-found: error
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: apps/web-e2e/test-results/
          if-no-files-found: ignore

  containers:
    # T-039: the three images (Dockerfile.api, Dockerfile.worker,
    # apps/web/Dockerfile; base images pinned by digest) and the local
    # staging composition on them (deploy/local/compose.yaml, LOCAL ONLY:
    # PostgreSQL, migrations as the migration login, seed, API, worker, web
    # and the repository's test OIDC provider; nothing leaves the runner).
    # Images are built, never pushed; no registry credential is used.
    name: containers (build, local staging smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker version && docker compose version
      - run: make build-containers
      - run: make staging-smoke

  db-smoke:
    # Disposable service container only (default libc en_US.utf8 collation, so
    # the D-034 byte-order manifest test runs under a non-C collation).
    # `make integration-test` applies the migrations up/down/up, runs
    # db/tests/*.sql, then the Go DB-backed tests: storage, tenant (runtime
    # logins, RLS, pool reuse) and the API through its real handler (T-009).
    name: db migrations + API integration (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: dt_admin
          POSTGRES_DB: dt_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dt_admin -d dt_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: psql --version
      - run: make integration-test
        env:
          DT_ALLOW_DB_TESTS: "yes"
          DATABASE_URL: postgresql://dt_admin@localhost:5432/dt_test_ci
          GEMINUS_TEST_DATABASE_URL: postgresql://dt_admin@localhost:5432/dt_test_ci
