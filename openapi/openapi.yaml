  /models/{id}/ai-proposals:
    post:
      operationId: createProposal
      summary: Queue edit or scenario proposal generation
      description: 'Core route from report pp.29–35. T-025 (D-002, D-016, D-046, D-061 PROPOSED): an editor or owner
        asks for a proposal on base_version_id, which must be a version of this model (another organization''s or no
        such version or model is 404; another model''s version is 422 at /base_version_id) and its latest (409
        MODEL_VERSION_CONFLICT otherwise: approval needs the latest base, AI_SPEC §6). An intent of only white space is
        422 at /intent. When this deployment''s AI is off the request is refused with 503 AI_PROVIDER_NOT_CONFIGURED
        or AI_POLICY_NOT_APPROVED and nothing is stored. Otherwise the proposal (generating, with the server''s ID
        allocation pool and the request''s output_locale and selected IDs, none of which changes later), its one
        model_proposal job, the proposal.create audit event (IDs and counts, never the intent) and the idempotency
        response commit together, then 202. The Idempotency-Key fingerprint is the model ID and the canonical body.
        The worker builds the sanitized context, asks the provider, and the server reviews the answer (patch profile,
        full candidate validation, ID pool, domain rules, dataset bindings, qualitative expected effects) and computes
        the risk; the proposal becomes ready, needs_input or invalid with the job''s completion, or failed when the job
        fails or is cancelled (getProposal). No AI tool writes anything; approval is approveProposal (T-026).'
      tags:
      - Proposals
      x-origin: SOURCE
      x-required-roles: *id001
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: id
        in: path
        required: true
        schema:
          $ref: ../schemas/common.schema.json#/$defs/ModelID
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted and durably queued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/http.schema.json#/$defs/ProposalAccepted
              examples:
                accepted:
                  summary: Stored and queued for generation
                  value:
                    proposal_id: aip_01M4YDQK00ADN261CME3WV5HZ7
                    status: generating
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/http.schema.json#/$defs/ProposalRequest
