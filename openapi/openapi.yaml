    patch:
      operationId: patchDraft
      summary: Apply bounded JSON Patch to draft
      description: Core route from report pp.29–35; detailed contract is a proposed engineering draft.
      tags:
      - Models
      x-origin: SOURCE
      x-required-roles: *id001
      parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - name: id
        in: path
        required: true
        schema:
          $ref: ../schemas/common.schema.json#/$defs/ModelID
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/DraftETag'
          content:
            application/json:
              schema:
                $ref: ../schemas/http.schema.json#/$defs/Draft
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 'Infrastructure unavailable; the draft was not changed (no new revision, no audit event), so the same
            patch with the same If-Match may be sent again. The draft''s base binds datasets and this deployment gives
            the model service no dataset storage; or the dataset binding stage, which checks the patched draft against
            the base''s manifest, could not read a snapshot from storage (details[0].code DATASET_STORAGE_FAILED, as
            publishVersion and approveProposal answer: D-087, H-023; the cause is logged, never sent); or the request
            could not complete (no details). A snapshot that no longer verifies is an issue of the draft, and any other
            failure of the binding stage is 500. Codes: SERVICE_UNAVAILABLE.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                no_storage:
                  summary: The base binds datasets and dataset storage is not configured
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: the version binds datasets and dataset storage is not available
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
                storage_failed:
                  summary: The dataset snapshots the base binds could not be read (H-022)
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: the dataset snapshots could not be read; nothing was changed (retry later)
                      details:
                      - path: ''
                        reason: the dataset storage failed
                        code: DATASET_STORAGE_FAILED
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: ../schemas/json-patch.schema.json
              - minItems: 1
