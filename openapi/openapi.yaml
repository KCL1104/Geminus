      description: 'D-012 (approved) P0 workflow completion endpoint; not explicitly listed in original core endpoint
        table. T-028 (REQ-010; D-004, D-014, D-020, D-021, D-057, D-067 APPROVED; D-078, D-079, D-080 APPROVED): an
        editor or owner saves a what-if on an immutable version of the organization, any of the model''s versions, not
        only the latest (D-067): a name and a JSON Patch under the scenario allowlist that the AI scenario mode takes too
        (D-021: existing capacities, distribution parameters and routing probabilities, and D-057''s line parameters; no
        topology change and no new dataset binding; a test before an array element is changed, D-020). [] saves a
        baseline. The request itself is checked first, as on every route (path ID 400, Idempotency-Key header 400,
        media type 415, body 400/413/422; a name of only white space is 422 at /name), then, in one transaction, the
        role (403) and the Idempotency-Key: the fingerprint is the version ID and the RFC 8785 form of the body, so the
        same key and body on another version is 409 IDEMPOTENCY_KEY_CONFLICT, and a replay still needs the role. A
        version of another organization, or none, is 404. The server checks the patch as it checks an AI scenario''s,
        trusting nothing the client says about it: the patch profile and allowlist (issues at /patch/<op>/...), the
        full validation of the base with the patch applied (issues at the candidate''s paths; warnings do not refuse),
        the domain pack''s rules, and the dataset binding stage against the base''s whole manifest with the snapshots
        read again (issues at /dataset_bindings/<i>/...). Any error is 422 MODEL_VALIDATION_FAILED and nothing is
        stored; a base that binds datasets without dataset storage, or snapshots that cannot be read (details[0].code
        DATASET_STORAGE_FAILED), is 503. Then exactly one immutable Scenario (source_proposal_id null, created_by the
        caller), its audit event scenario.create (IDs, the patch hash and the number of operations; never the name or
        the patch) and the idempotency response commit together, and 201 answers the Scenario as getScenario shows it.
        No version is created, the model and its draft are untouched and nothing is queued: a run is the person''s
