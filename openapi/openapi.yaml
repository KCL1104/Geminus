          description: 'Infrastructure unavailable; the draft was not changed (no new revision, no audit event), so the same
            reset with the same If-Match may be sent again. The latest version binds datasets and this deployment gives
            the model service no dataset storage; or the dataset binding stage, which checks the latest version''s
            content, the draft''s new content, against that version''s manifest, could not read a snapshot from storage
            (details[0].code DATASET_STORAGE_FAILED, as publishVersion and approveProposal answer: D-087, H-023; the
            cause is logged, never sent); or the request could not complete (no details). Any other failure of the
            binding stage is 500. Codes: SERVICE_UNAVAILABLE.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                no_storage:
                  summary: The base binds datasets and dataset storage is not configured
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: the version binds datasets and dataset storage is not available
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
                storage_failed:
                  summary: The dataset snapshots the base binds could not be read (H-022)
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: the dataset snapshots could not be read; nothing was changed (retry later)
                      details:
                      - path: ''
                        reason: the dataset storage failed
                        code: DATASET_STORAGE_FAILED
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/http.schema.json#/$defs/ResetDraft
