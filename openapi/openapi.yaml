        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          description: 'Schema, semantic, dataset or constraint validation failed. A draft that uses a line-flow member
            (ADR-026) this build does not implement yet is refused with PRIMITIVE_NOT_SUPPORTED at each such member (D-063
            PROPOSED). Codes: MODEL_VALIDATION_FAILED, REQUEST_VALIDATION_FAILED.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                primitive_not_supported:
                  summary: The draft gives a queue a finite capacity, which the engine does not run before T-047
                  value:
                    error:
                      code: MODEL_VALIDATION_FAILED
                      message: the model is not valid
                      details:
                      - path: /nodes/4/capacity
                        reason: this build does not support finite queue capacity (ADR-026 D-049) yet; remove it to
                          publish or run the model
                        code: PRIMITIVE_NOT_SUPPORTED
                        severity: error
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 'Infrastructure unavailable; nothing was published (no version, no audit event, and the
            Idempotency-Key keeps no answer, so the same request may be sent again). The base binds datasets and this
            deployment gives the model service no dataset storage; or the dataset binding stage could not read a
            snapshot the base binds from storage, either while it checks the candidate or while it checks the draft that
            follows the new version (details[0].code DATASET_STORAGE_FAILED, as approveProposal and createManualScenario
            answer, D-069 (b), H-022; the cause is logged, never sent); or the request could not complete (no details).
            A snapshot that no longer verifies is 422; any other failure of the binding stage is 500. Codes:
            SERVICE_UNAVAILABLE.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                no_storage:
                  summary: The base binds datasets and dataset storage is not configured
                  value:
                    error:
