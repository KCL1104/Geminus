    get:
      operationId: getImport
      summary: Get preview, validation and lifecycle
      description: 'Core route from report pp.29–35. T-016 (D-043): profile is null and preview empty while status is
        UPLOADED or PROFILING; once the import_profile job has read the whole file the import is AWAITING_MAPPING with the
        profile and the first rows'' raw values, or FAILED with error. A FAILED import''s error.details[0] carries the
        failure''s own code and, for a parse error, a JSON Pointer into the file seen as an array of rows (a JSON events
        file is that array; a CSV row''s index counts data rows from 0) or, for a JSON model, into the document;
        error.request_id is the request behind the step that failed (the upload''s while the file is profiled; once a
        mapping is saved, the save of the current mapping_revision; see the validation_failed example); a message never
        quotes the file and a path has at most 2,048 characters (a
        longer one names an ancestor). A CSV record (the header included) and a JSON events row are at most 1 MiB as
        written, a JSON model at most 2 MiB (IMPORT_LIMIT_EXCEEDED). An import whose import_profile job fails for good or
        is cancelled before the file is profiled is FAILED with the job''s error (for example OBJECT_STORAGE_UNAVAILABLE
        or JOB_CANCELLED). invalid_rows counts CSV rows whose field count differs from the header; they are listed in the
        error report (downloadImportErrors). T-017 (D-071, D-072 APPROVED): after a person saves a mapping
        (saveImportMapping) the import is VALIDATING, with no validation, invalid rows, canonical preview or error report,
        until the import_validate job of the current mapping_revision has read every row; then it is VALIDATED (every row
        maps to a valid canonical event; validation.valid true, invalid_rows 0, canonical_preview the preview rows'' events)
        or AWAITING_MAPPING with validation.valid false, the first 100 issues, invalid_rows and an error report of every
        invalid row, ready to be mapped again. These results always describe the current mapping_revision: a job of an
        older revision never writes them. An import whose import_validate job of the current revision fails for good or is
        cancelled is FAILED with the job''s error.'
