  /me:
    get:
      operationId: getMe
      summary: The caller's user ID and own memberships
      description: 'D-045 (approved, H-010; resolves CB-17): membership discovery for the UI. Any authenticated
        user whose identity was provisioned (D-008); it selects no organization (x-tenant-scope user), so no role
        is required and X-Organization-ID must not be sent. Returns the caller''s memberships with each
        organization''s ID and name, ordered by organization name, then organization ID, in byte (code point)
        order; at most 100, with truncated true and the first 100 in that order when there are more. A user
        without memberships gets an empty list. An identity without a user is 403 FORBIDDEN, and none is
        created. The role only shapes the UI: every other operation authorizes its own request. Personal data:
        never cached (Cache-Control: no-store). A read, so not audited.'
      tags:
      - Memberships
      x-origin: PROPOSED
      x-tenant-scope: user
      x-required-roles: []
      parameters:
      - $ref: '#/components/parameters/NoOrganizationContext'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: ../schemas/http.schema.json#/$defs/Me
              examples:
                memberships:
                  summary: Three memberships; two organizations share a name and are ordered by ID
                  value:
                    user_id: usr_01M4YDQK0016KTK4JM6KAHZ6BR
                    memberships:
                    - organization_id: org_01M4YDQK004J6EG1BW3SRYPDGD
                      organization_name: Acme Delivery
                      role: viewer
                    - organization_id: org_01M4YDQK00Y5H2929M9WWZWTVH
                      organization_name: Acme Delivery
                      role: owner
                    - organization_id: org_01M4YDQK00TA00000000000003
                      organization_name: 研發部
                      role: editor
                    truncated: false
                none:
                  summary: A provisioned user without memberships
                  value:
                    user_id: usr_01M4YDQK0016KTK4JM6KAHZ6BR
                    memberships: []
                    truncated: false
        '400':
          description: 'X-Organization-ID was sent (detail reason X-Organization-ID), or the request is otherwise
            malformed. Codes: INVALID_REQUEST.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: 'The token is valid but no user has its identity (users are provisioned, never created from
            a token, D-008). Codes: FORBIDDEN.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC JWT
  parameters:
    OrganizationContext:
      name: X-Organization-ID
      in: header
      required: true
      description: Tenant selector only. JWT subject + current membership authorize this scope. Never trust a role
        from this header. D-008.
      schema:
        $ref: ../schemas/common.schema.json#/$defs/OrganizationID
    NoOrganizationContext:
      name: X-Organization-ID
      in: header
      required: false
      description: 'Must not be sent: the operation reads the caller''s own identity and selects no organization
        (D-045). A request that carries the header, even empty, is 400 INVALID_REQUEST with detail reason
        X-Organization-ID; the header is never ignored, so a client cannot believe it selected one.'
      schema:
        not: {}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped by organization, authenticated actor, HTTP operation and resource. Same key+body replays;
        different body returns 409. D-011.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[!-~]{8,128}$
        description: Visible ASCII only (U+0021–U+007E), so a key stores and logs unambiguously (ADR-019).
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag e.g. "draft-revision-12". Missing=428; stale=409 MODEL_VERSION_CONFLICT as
        specified by source.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^"draft-revision-[1-9][0-9]*"$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Opaque tenant/resource-bound pagination cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error400:
      description: 'Malformed JSON, duplicate keys, invalid request encoding or parameter. Codes: INVALID_REQUEST, IDEMPOTENCY_KEY_REQUIRED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error401:
      description: 'Missing/invalid/expired JWT. Codes: UNAUTHENTICATED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error403:
      description: 'Authenticated member lacks required role. Codes: FORBIDDEN.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error404:
      description: 'Resource unavailable in authorized tenant/parent scope. Codes: NOT_FOUND.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error409:
      description: 'Base/revision conflict, invalid lifecycle, idempotency body mismatch or result not ready. Codes: MODEL_VERSION_CONFLICT, IDEMPOTENCY_KEY_CONFLICT, LIFECYCLE_CONFLICT, RESULT_NOT_READY, PROPOSAL_ALREADY_DECIDED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error413:
      description: 'Upload/request size limit exceeded. Codes: PAYLOAD_TOO_LARGE.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error415:
      description: 'Unsupported request Content-Type. Codes: UNSUPPORTED_MEDIA_TYPE.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error422:
      description: 'Schema, semantic, dataset or constraint validation failed. Codes: MODEL_VALIDATION_FAILED, REQUEST_VALIDATION_FAILED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error428:
      description: 'Required concurrency precondition missing. Codes: PRECONDITION_REQUIRED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error429:
      description: 'Tenant/request/provider quota exceeded. Codes: RATE_LIMITED.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/Error
    Error500:
      description: 'Internal error; no partial canonical commit. Codes: INTERNAL_ERROR.'
