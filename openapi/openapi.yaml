      description: 'Core route from report pp.29–35. T-016 (D-007, D-009, D-035, D-043, D-044): the caller''s role is
        checked before any of the body is read. The parts project_id, model_id, base_version_id and kind come first, each
        once, and file is the last part (its filename is kept, 1–255 characters, without any directory); a file part before
        all four, a repeated or unknown part, or a part after file is refused. The file is streamed to private object
        storage under a key the server makes (tenant/<organization>/imports/<import>/upload) while its SHA-256 and size are
        computed; at most 50,000,000 bytes are accepted whether or not Content-Length is sent (413 PAYLOAD_TOO_LARGE, nothing
        kept), an empty file is 422, and archives and executables (ZIP, gzip, bzip2, xz, zstd, 7z, RAR, tar, OLE, ELF, PE,
        Mach-O, WebAssembly, scripts starting with #!, and such file name extensions) are 415 UNSUPPORTED_MEDIA_TYPE with
        details[0].code IMPORT_FORMAT_REJECTED. CSV is UTF-8 (a BOM is allowed and recorded), comma separated (RFC 4180);
        no other encoding or delimiter is guessed. The import, its import_profile job and the import.upload audit event
        commit together; 202 means the job is durably queued and nothing in the file has been parsed yet. Profiling never
        changes the Twin (D-009). The Idempotency-Key fingerprint is the four fields, the file name and the file''s SHA-256
        and size; a retry with the same key and file replays the first response.'
