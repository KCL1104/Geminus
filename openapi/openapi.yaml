        comment, with its audit event (never the comment) and the idempotency response (fingerprint: the proposal ID
        and the canonical body), in one transaction that takes the model row before the proposal, as approveProposal
        does, so an approval and a rejection of one proposal run one after the other. Nothing else changes: no model,
        draft, version or scenario (TEST-006). approved, rejected or conflicted: 409 PROPOSAL_ALREADY_DECIDED;
        generating, invalid or failed: 409 LIFECYCLE_CONFLICT. The answer is the proposal as getProposal shows it.'
