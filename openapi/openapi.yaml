      operationId: listProposals
      summary: List model proposals
      description: 'D-012 (approved) P0 workflow completion endpoint; not explicitly listed in original core endpoint
        table. T-025: any member; the model''s proposals oldest first (created_at, then ID), each as getProposal shows
        it; the cursor is bound to the organization, the model and this list.'
