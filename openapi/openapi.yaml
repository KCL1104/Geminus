        stored report itself, checked against its recorded SHA-256 and size (500 and no bytes when it does not match); no
        signed URL, and the client names only the import, never an object key. 404 NOT_FOUND when the import has no error
        report. The report is CSV (RFC 4180, CRLF, every cell quoted, UTF-8 with a BOM so that spreadsheets read non-ASCII
        text) with the header path,line,column,code,message,value: path is the JSON Pointer of the row (or row and column)
        in the file seen as an array of rows, line the 1-based line of the uploaded file where the record starts, column
        the source column name, value at most 256 characters of the offending value. Every cell that starts (after spaces
        and quotes) with =, +, -, @, a tab, a carriage return or a line feed, or their full-width forms, is prefixed with an
        apostrophe, and so is every part of a cell after a comma, semicolon, tab or line end that would start that way
        (the apostrophe follows the separator), so a spreadsheet shows it as text and never runs it as a formula, however
        it splits cells (TEST-029); the stored upload is never changed. A report is at most 16 MiB: a last row with code
        ERRORS_TRUNCATED says how many errors are not listed.'
