      summary: Approve after revalidation; effect depends on mode
      description: edit -> exactly one new ModelVersion. scenario -> exactly one immutable Scenario and ZERO new
        ModelVersions. No implicit run. Reject stale latest base with 409; no auto-rebase. D-003/D-004. Audit and
        idempotency response in same transaction. Approving an already approved or rejected proposal with a new
        Idempotency-Key returns 409 PROPOSAL_ALREADY_DECIDED and changes nothing (D-030).
