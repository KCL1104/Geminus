        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          description: 'Schema, semantic, dataset or constraint validation failed. The effective model (version plus
            scenario patch) must compile: a line-flow member (ADR-026) the engine does not run yet is refused with
            PRIMITIVE_NOT_SUPPORTED before anything is queued (D-063 PROPOSED). Codes: MODEL_VALIDATION_FAILED,
            REQUEST_VALIDATION_FAILED.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                primitive_not_supported:
                  summary: The scenario patch adds a finite capacity to an unlimited queue (D-057), which the engine
                    does not run before T-047
                  value:
                    error:
                      code: MODEL_VALIDATION_FAILED
                      message: the run's effective model is not valid
                      details:
                      - path: /nodes/3/capacity
                        reason: this build does not support finite queue capacity (ADR-026 D-049) yet; remove it to
                          publish or run the model
                        code: PRIMITIVE_NOT_SUPPORTED
                        severity: error
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 'Infrastructure unavailable; nothing was queued (no run, no job, no audit event, and the
            Idempotency-Key keeps no answer, so the same request may be sent again). The run needs object storage (its
            version binds datasets, or trace_level is sampled) and this deployment has none; or the dataset binding
            stage could not read a snapshot the version binds from storage (details[0].code DATASET_STORAGE_FAILED, as
            approveProposal and createManualScenario answer, D-069 (b), H-022; the cause is logged, never sent); or the
            request could not complete (no details). A snapshot that no longer verifies is 422; any other failure of the
            binding stage is 500. Codes: SERVICE_UNAVAILABLE.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/Error
              examples:
                no_storage:
                  summary: The version binds datasets (or the run asks for a sampled trace) and object storage is not
                    configured
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: object storage is not configured for this deployment
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
                storage_failed:
                  summary: The dataset snapshots the version binds could not be read (H-022)
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: the dataset snapshots could not be read; nothing was queued (retry later)
                      details:
                      - path: ''
                        reason: the dataset storage failed
                        code: DATASET_STORAGE_FAILED
                      request_id: req_01M4YDQK00V6H8S0ST4F7510KR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/simulation.schema.json#/$defs/RunRequest
